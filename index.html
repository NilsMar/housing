<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>London Property Tracker</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8f9fa; color: #2c3e50; padding: 20px; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.sub { color: #7f8c8d; font-size: 0.85rem; margin-bottom: 16px; }
    #scatter-div { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 8px; }
    #spider-section { margin-top: 20px; display: none; }
    #spider-header { padding: 12px 16px; background: white; border-radius: 8px 8px 0 0;
                      border-bottom: 1px solid #eee; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    #spider-header h2 { font-size: 1rem; }
    #spider-header a { color: #2980b9; font-size: 0.85rem; }
    #spider-header .meta { color: #7f8c8d; font-size: 0.82rem; margin-top: 2px; }
    #spider-div { background: white; border-radius: 0 0 8px 8px;
                   box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 8px; }
  </style>
</head>
<body>
  <h1>London Property Tracker</h1>
  <p class="sub">Click any dot to drill into its scoring breakdown. Dot size = bedrooms. Colour = days listed.</p>
  <div id="scatter-div">
    <div id="scatter"></div>
  </div>
  <div id="spider-section">
    <div id="spider-header">
      <h2 id="spider-title"></h2>
      <div class="meta" id="spider-meta"></div>
    </div>
    <div id="spider-div">
      <div id="spider"></div>
    </div>
  </div>

  <script>
    const scatterSpec = {"data":[{"customdata":[],"hovertemplate":"%{text}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"cmax":1,"cmin":0,"color":[],"colorbar":{"len":0.5,"ticktext":["Today","10d","20d","30d+"],"tickvals":[0,0.33,0.66,1.0],"title":{"text":"Days listed"}},"colorscale":[[0.0,"#27ae60"],[0.33,"#f39c12"],[1.0,"#e74c3c"]],"line":{"color":"white","width":1},"opacity":0.85,"size":[]},"mode":"markers","name":"Listings","text":[],"x":[],"y":[],"type":"scatter"}],"layout":{"template":{"data":{"histogram2dcontour":[{"type":"histogram2dcontour","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]]}],"choropleth":[{"type":"choropleth","colorbar":{"outlinewidth":0,"ticks":""}}],"histogram2d":[{"type":"histogram2d","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]]}],"heatmap":[{"type":"heatmap","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]]}],"contourcarpet":[{"type":"contourcarpet","colorbar":{"outlinewidth":0,"ticks":""}}],"contour":[{"type":"contour","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]]}],"surface":[{"type":"surface","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]]}],"mesh3d":[{"type":"mesh3d","colorbar":{"outlinewidth":0,"ticks":""}}],"scatter":[{"fillpattern":{"fillmode":"overlay","size":10,"solidity":0.2},"type":"scatter"}],"parcoords":[{"type":"parcoords","line":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scatterpolargl":[{"type":"scatterpolargl","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"bar":[{"error_x":{"color":"#2a3f5f"},"error_y":{"color":"#2a3f5f"},"marker":{"line":{"color":"#E5ECF6","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"bar"}],"scattergeo":[{"type":"scattergeo","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scatterpolar":[{"type":"scatterpolar","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"histogram":[{"marker":{"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"histogram"}],"scattergl":[{"type":"scattergl","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scatter3d":[{"type":"scatter3d","line":{"colorbar":{"outlinewidth":0,"ticks":""}},"marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scattermap":[{"type":"scattermap","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scatterternary":[{"type":"scatterternary","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"scattercarpet":[{"type":"scattercarpet","marker":{"colorbar":{"outlinewidth":0,"ticks":""}}}],"carpet":[{"aaxis":{"endlinecolor":"#2a3f5f","gridcolor":"white","linecolor":"white","minorgridcolor":"white","startlinecolor":"#2a3f5f"},"baxis":{"endlinecolor":"#2a3f5f","gridcolor":"white","linecolor":"white","minorgridcolor":"white","startlinecolor":"#2a3f5f"},"type":"carpet"}],"table":[{"cells":{"fill":{"color":"#EBF0F8"},"line":{"color":"white"}},"header":{"fill":{"color":"#C8D4E3"},"line":{"color":"white"}},"type":"table"}],"barpolar":[{"marker":{"line":{"color":"#E5ECF6","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"barpolar"}],"pie":[{"automargin":true,"type":"pie"}]},"layout":{"autotypenumbers":"strict","colorway":["#636efa","#EF553B","#00cc96","#ab63fa","#FFA15A","#19d3f3","#FF6692","#B6E880","#FF97FF","#FECB52"],"font":{"color":"#2a3f5f"},"hovermode":"closest","hoverlabel":{"align":"left"},"paper_bgcolor":"white","plot_bgcolor":"#E5ECF6","polar":{"bgcolor":"#E5ECF6","angularaxis":{"gridcolor":"white","linecolor":"white","ticks":""},"radialaxis":{"gridcolor":"white","linecolor":"white","ticks":""}},"ternary":{"bgcolor":"#E5ECF6","aaxis":{"gridcolor":"white","linecolor":"white","ticks":""},"baxis":{"gridcolor":"white","linecolor":"white","ticks":""},"caxis":{"gridcolor":"white","linecolor":"white","ticks":""}},"coloraxis":{"colorbar":{"outlinewidth":0,"ticks":""}},"colorscale":{"sequential":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]],"sequentialminus":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]],"diverging":[[0,"#8e0152"],[0.1,"#c51b7d"],[0.2,"#de77ae"],[0.3,"#f1b6da"],[0.4,"#fde0ef"],[0.5,"#f7f7f7"],[0.6,"#e6f5d0"],[0.7,"#b8e186"],[0.8,"#7fbc41"],[0.9,"#4d9221"],[1,"#276419"]]},"xaxis":{"gridcolor":"white","linecolor":"white","ticks":"","title":{"standoff":15},"zerolinecolor":"white","automargin":true,"zerolinewidth":2},"yaxis":{"gridcolor":"white","linecolor":"white","ticks":"","title":{"standoff":15},"zerolinecolor":"white","automargin":true,"zerolinewidth":2},"scene":{"xaxis":{"backgroundcolor":"#E5ECF6","gridcolor":"white","linecolor":"white","showbackground":true,"ticks":"","zerolinecolor":"white","gridwidth":2},"yaxis":{"backgroundcolor":"#E5ECF6","gridcolor":"white","linecolor":"white","showbackground":true,"ticks":"","zerolinecolor":"white","gridwidth":2},"zaxis":{"backgroundcolor":"#E5ECF6","gridcolor":"white","linecolor":"white","showbackground":true,"ticks":"","zerolinecolor":"white","gridwidth":2}},"shapedefaults":{"line":{"color":"#2a3f5f"}},"annotationdefaults":{"arrowcolor":"#2a3f5f","arrowhead":0,"arrowwidth":1},"geo":{"bgcolor":"white","landcolor":"#E5ECF6","subunitcolor":"white","showland":true,"showlakes":true,"lakecolor":"white"},"title":{"x":0.05}}},"xaxis":{"title":{"text":"Asking price (\u00a3)"},"tickformat":"\u00a3,.0f","gridcolor":"#f0f0f0"},"yaxis":{"title":{"text":"Weighted score (0\u2013100)"},"range":[0,105],"gridcolor":"#f0f0f0"},"font":{"family":"system-ui, sans-serif","size":13},"legend":{"orientation":"h","y":-0.15},"margin":{"t":60,"b":60,"l":60,"r":20},"title":{"text":"London property tracker \u2014 score vs. price"},"plot_bgcolor":"white","paper_bgcolor":"white","annotations":[{"font":{"color":"rgba(100,100,200,0.7)","size":11},"showarrow":false,"text":"\u2b06 Above line = better value","x":0.01,"xanchor":"left","xref":"paper","y":0.99,"yanchor":"top","yref":"paper"}]}};
    const spiderData = {};

    Plotly.newPlot('scatter', scatterSpec.data, scatterSpec.layout, {responsive: true});

    document.getElementById('scatter').on('plotly_click', function(evt) {
      const pt = evt.points[0];
      const id = pt.customdata;
      const d = spiderData[id];
      if (!d) return;

      document.getElementById('spider-section').style.display = 'block';
      document.getElementById('spider-title').textContent = d.address;

      const price = d.price ? '£' + d.price.toLocaleString('en-GB') : '';
      const garden = d.has_garden ? 'Garden ✓' : 'No garden';
      document.getElementById('spider-meta').textContent =
        `Score: ${d.score}/100  ·  ${price}  ·  ${d.bedrooms || '?'} bed  ·  ${d.tenure}  ·  ${garden}`;

      const link = document.getElementById('spider-title');
      link.innerHTML = `${d.address} <a href="${d.url}" target="_blank" style="font-size:.8rem;color:#2980b9">View listing ↗</a>`;

      Plotly.react('spider', [{
        type: 'scatterpolar',
        r: d.traces.r,
        theta: d.traces.theta,
        fill: 'toself',
        fillcolor: 'rgba(41,128,185,0.18)',
        line: {color: '#2980b9', width: 2},
        name: d.address,
      }], {
        polar: {
          radialaxis: {visible: true, range: [0, 10], tickvals: [0,2,4,6,8,10]},
          bgcolor: 'white',
        },
        paper_bgcolor: 'white',
        font: {family: 'system-ui, sans-serif', size: 12},
        margin: {t: 20, b: 20, l: 40, r: 40},
        showlegend: false,
        height: 400,
      });

      document.getElementById('spider-section').scrollIntoView({behavior: 'smooth', block: 'nearest'});
    });
  </script>
</body>
</html>
